# Contoh reverse proxy untuk nuha-chatbot-fe (port 3001)
# Ganti server_name dan path sesuai server Anda.

upstream nuha_chatbot {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name chatbot.example.com;

    # ssl_certificate ...
    # ssl_certificate_key ...

    client_max_body_size 10m;

    location / {
        proxy_pass http://nuha_chatbot;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Penting: jangan hapus header Upgrade untuk Next.js
}

# Jika app dipasang di SUBPATH /chatbot (bukan root domain):
